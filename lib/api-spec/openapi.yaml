openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parts
    description: Jyothi EV parts catalog
  - name: admin
    description: Admin access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /parts:
    get:
      operationId: listParts
      tags: [parts]
      summary: List available EV parts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Parts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartList"
    post:
      operationId: createPart
      tags: [parts]
      summary: Add a part to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartInput"
      responses:
        "201":
          description: Created part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
        "400":
          description: Invalid part
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Check whether the signed-in account is an admin
      responses:
        "200":
          description: Admin access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "401":
          description: Sign-in required
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [admin]
      summary: Request a secure product image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequestMetadata"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid file metadata
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /parts/{id}:
    patch:
      operationId: updatePart
      tags: [parts]
      summary: Update a catalog part
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartUpdate"
      responses:
        "200":
          description: Updated part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
        "400":
          description: Invalid part
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Part not found
    delete:
      operationId: deletePart
      tags: [parts]
      summary: Delete a catalog part
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Part deleted
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Part not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Part:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        category:
          type: string
        price:
          type: number
          minimum: 0
        description:
          type: string
        icon:
          type: string
          enum: [motor, controller, display, charger, brake, battery]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, category, price, description, icon, imageUrl, createdAt, updatedAt]
    PartInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        description:
          type: string
          minLength: 1
        icon:
          type: string
          enum: [motor, controller, display, charger, brake, battery]
        imageUrl:
          type: ["string", "null"]
      required: [name, category, price, description, icon]
    PartUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        description:
          type: string
          minLength: 1
        icon:
          type: string
          enum: [motor, controller, display, charger, brake, battery]
        imageUrl:
          type: ["string", "null"]
    PartList:
      type: array
      items:
        $ref: "#/components/schemas/Part"
    AdminStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
        email:
          type: string
      required: [isAdmin, email]
    UploadRequestMetadata:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadRequestMetadata"
      required: [uploadURL, objectPath, metadata]

